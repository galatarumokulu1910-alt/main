<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <pattern id="archGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C5A059" stroke-width="0.4" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="620" fill="#FAF7F2"/>
  <rect x="24" y="24" width="752" height="572" fill="url(#archGrid2)" stroke="#C5A059" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="30" y="30" width="740" height="560" fill="none" stroke="#1A1817" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top Header Banner -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1A1817">
    <text x="50" y="62" font-size="11" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5" fill="#9A7832">KAT 2 • MİMARİ YERLEŞİM &amp; GALERİ PLANI</text>
    <text x="50" y="86" font-size="22" font-weight="600">2. Kat Sergi Odaları, Paralel Salonlar &amp; Fuaye (275 m²)</text>
    <text x="50" y="105" font-size="11.5" font-family="Arial, sans-serif" fill="#5C554E">Tavan Yüksekliği: 4.20 m  |  5 Bağlantılı Tarihi Oda + Merkez Fuaye  |  Paralel Oturum &amp; Butik Sergi Düzeni</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(715, 72)">
    <circle cx="0" cy="0" r="22" fill="#FAF7F2" stroke="#C5A059" stroke-width="1"/>
    <polygon points="0,-18 4,-4 0,-7 -4,-4" fill="#1A1817"/>
    <polygon points="0,18 4,4 0,7 -4,4" fill="#C5A059"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#C5A059" stroke-width="0.8"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1A1817">N</text>
  </g>

  <!-- Building Footprint -->
  <g transform="translate(70, 135)">
    <rect x="0" y="0" width="660" height="370" fill="#FFFFFF" stroke="#1A1817" stroke-width="5"/>

    <!-- Window Bays North -->
    <g fill="#FAF7F2" stroke="#C5A059" stroke-width="2">
      <rect x="55" y="-4" width="44" height="8"/>
      <rect x="135" y="-4" width="44" height="8"/>
      <rect x="235" y="-4" width="44" height="8"/>
      <rect x="315" y="-4" width="44" height="8"/>
      <rect x="405" y="-4" width="44" height="8"/>
    </g>

    <!-- Window Bays South -->
    <g fill="#FAF7F2" stroke="#C5A059" stroke-width="2">
      <rect x="55" y="366" width="44" height="8"/>
      <rect x="155" y="366" width="44" height="8"/>
      <rect x="265" y="366" width="44" height="8"/>
      <rect x="375" y="366" width="44" height="8"/>
    </g>

    <!-- NORTH ROW ROOMS (Galeri 2A, Galeri 2B, Galeri 2C) -->
    <!-- Galeri 2A (Left North) -->
    <rect x="4" y="4" width="166" height="142" fill="#FCFBF8" stroke="#1A1817" stroke-width="2.5"/>
    <text x="87" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1817">Salon 2A</text>
    <text x="87" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9A7832">52 m² (8.0 × 6.5 m)</text>
    <text x="87" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Ana Seminer / Galeri</text>
    <text x="87" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Kapasite: 45 Tiyatro / 26 U-Masa</text>

    <!-- Galeri 2B (Middle North) -->
    <rect x="170" y="4" width="150" height="142" fill="#FCFBF8" stroke="#1A1817" stroke-width="2.5"/>
    <text x="245" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1817">Salon 2B</text>
    <text x="245" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9A7832">46 m² (7.2 × 6.4 m)</text>
    <text x="245" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Bağlantılı Sergi / Atölye</text>
    <text x="245" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Kapasite: 40 Tiyatro / 24 Sınıf</text>

    <!-- Galeri 2C (Right North) -->
    <rect x="320" y="4" width="142" height="142" fill="#FCFBF8" stroke="#1A1817" stroke-width="2.5"/>
    <text x="391" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1817">Salon 2C</text>
    <text x="391" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9A7832">42 m² (6.6 × 6.4 m)</text>
    <text x="391" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Paralel Oturum / Sergi</text>
    <text x="391" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Kapasite: 35 Tiyatro / 20 Boardroom</text>

    <!-- Interconnecting Enfilade Doorways Between 2A-2B-2C -->
    <rect x="166" y="56" width="8" height="32" fill="#FAF7F2" stroke="#C5A059" stroke-width="1"/>
    <rect x="316" y="56" width="8" height="32" fill="#FAF7F2" stroke="#C5A059" stroke-width="1"/>

    <!-- CENTRAL GALLERY FOYER & COFFEE BREAK CORRIDOR -->
    <rect x="4" y="146" width="458" height="82" fill="#F4EFE6" stroke="#C5A059" stroke-width="1.5"/>
    <text x="233" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1A1817">Merkez Galeri Holü &amp; Coffee Break Fuayesi (65 m²)</text>
    <text x="233" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#5C554E">Tüm Odalar Arası Doğrudan Geçiş (Enfilade Mimari) • İkram &amp; Networking Alanı</text>

    <!-- Doorways from Central Hall into North & South Rooms -->
    <g fill="#FAF7F2" stroke="#C5A059" stroke-width="1.2">
      <rect x="72" y="142" width="30" height="8"/>
      <rect x="230" y="142" width="30" height="8"/>
      <rect x="376" y="142" width="30" height="8"/>
      <rect x="95" y="224" width="32" height="8"/>
      <rect x="315" y="224" width="32" height="8"/>
    </g>

    <!-- SOUTH ROW ROOMS (Salon 2D & VIP / Green Room 2E) -->
    <rect x="4" y="228" width="228" height="138" fill="#FCFBF8" stroke="#1A1817" stroke-width="2.5"/>
    <text x="118" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1817">Salon 2D (Güney Galeri)</text>
    <text x="118" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9A7832">44 m² (7.4 × 6.0 m)</text>
    <text x="118" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Butik Sergi • VIP Yemek • Atölye</text>

    <rect x="232" y="228" width="230" height="138" fill="#FCFBF8" stroke="#1A1817" stroke-width="2.5"/>
    <text x="347" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1817">Salon 2E (VIP Lounge &amp; Kulis)</text>
    <text x="347" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9A7832">26 m² + Teknik Odası</text>
    <text x="347" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Konuşmacı Hazırlık (Green Room) • Basın Odası</text>

    <!-- EAST CORE: STAIRCASE, ELEVATOR, FOYER LANDING & WC -->
    <rect x="462" y="4" width="126" height="92" fill="#F6F2EA" stroke="#1A1817" stroke-width="1.5"/>
    <text x="525" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1817">TARİHİ MERDİVEN</text>
    <text x="525" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Kat Sahanlığı (G: 2.10 m)</text>

    <rect x="588" y="4" width="68" height="92" fill="#EFE9DC" stroke="#1A1817" stroke-width="1.5"/>
    <text x="622" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1A1817">ASANSÖR</text>
    <text x="622" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9A7832">630 kg / 8 Kişi</text>

    <rect x="462" y="96" width="194" height="168" fill="#FAF7F2" stroke="#C5A059" stroke-width="1"/>
    <text x="559" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#1A1817">Doğu Kat Sahanlığı</text>
    <text x="559" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#9A7832">Karşılama &amp; Yönlendirme</text>
    <text x="559" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">3×32A Trifaze Kat Panosu</text>

    <rect x="462" y="264" width="194" height="102" fill="#F6F2EA" stroke="#1A1817" stroke-width="1.5"/>
    <text x="559" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1817">SERVİS MUTFAĞI &amp; WC</text>
    <text x="559" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Coffee Break Hazırlık &amp; Misafir WC</text>
  </g>

  <!-- Bottom Legend & Scale Bar -->
  <g transform="translate(50, 536)" font-family="Arial, sans-serif" font-size="10" fill="#1A1817">
    <rect x="0" y="0" width="14" height="14" fill="#FCFBF8" stroke="#1A1817" stroke-width="1.5"/>
    <text x="20" y="11">Bağlantılı Galeri / Seminer Odaları (5 Adet)</text>

    <rect x="245" y="0" width="14" height="14" fill="#F4EFE6" stroke="#C5A059" stroke-width="1.2"/>
    <text x="265" y="11">Merkez Fuaye &amp; Coffee Break (65 m²)</text>

    <rect x="465" y="0" width="14" height="14" fill="#EFE9DC" stroke="#1A1817" stroke-width="1"/>
    <text x="485" y="11">Asansör &amp; Merdiven</text>

    <g transform="translate(600, 2)">
      <line x1="0" y1="8" x2="120" y2="8" stroke="#1A1817" stroke-width="1.5"/>
      <line x1="0" y1="3" x2="0" y2="13" stroke="#1A1817" stroke-width="1.5"/>
      <line x1="60" y1="4" x2="60" y2="12" stroke="#1A1817" stroke-width="1.2"/>
      <line x1="120" y1="3" x2="120" y2="13" stroke="#1A1817" stroke-width="1.5"/>
      <text x="0" y="-1" font-size="8.5" fill="#5C554E">0</text>
      <text x="56" y="-1" font-size="8.5" fill="#5C554E">5m</text>
      <text x="110" y="-1" font-size="8.5" fill="#5C554E">10m</text>
    </g>
  </g>
</svg>
