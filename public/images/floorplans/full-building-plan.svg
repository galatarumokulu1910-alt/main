<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <pattern id="archGrid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C5A059" stroke-width="0.4" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="620" fill="#FAF7F2"/>
  <rect x="24" y="24" width="752" height="572" fill="url(#archGrid4)" stroke="#C5A059" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="30" y="30" width="740" height="560" fill="none" stroke="#1A1817" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top Header Banner -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1A1817">
    <text x="50" y="62" font-size="11" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5" fill="#9A7832">TÜM BİNA KAPATMA (FULL BUYOUT) • MİMARİ KESİT &amp; AKIM PLANI</text>
    <text x="50" y="86" font-size="22" font-weight="600">Galata Rum Okulu — 3 Kat Bütüncül Etkinlik Alanı (1.060 m²)</text>
    <text x="50" y="105" font-size="11.5" font-family="Arial, sans-serif" fill="#5C554E">Büyük Salon + Asma Kat + 5 Paralel Galeri + 2 Büyük Sergi Kanadı + 3 Kat Fuayesi  |  3×125A Ana Enerji</text>
  </g>

  <!-- Neoclassical Roof Pediment -->
  <g transform="translate(70, 122)">
    <polygon points="0,34 330,0 660,34" fill="#EFE9DC" stroke="#1A1817" stroke-width="3"/>
    <text x="330" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="3" fill="#9A7832">1910 NEOKLASİK ANITSAL YAPI</text>

    <!-- LEVEL 3 ROW (458 m²) -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="660" height="106" fill="#FFFFFF" stroke="#1A1817" stroke-width="3.5"/>
      <rect x="8" y="8" width="452" height="90" fill="#FCFBF8" stroke="#C5A059" stroke-width="1.2"/>
      <text x="24" y="32" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#9A7832">KAT 3 • BÜYÜK SERGİ &amp; RESEPSİYON KATI (TAVAN: 4.60 m)</text>
      <text x="24" y="54" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1A1817">Kuzey &amp; Güney Sergi Kanatları + Merkez Fuaye — 458 m²</text>
      <text x="24" y="74" font-family="Arial, sans-serif" font-size="10" fill="#5C554E">Kapasite: 220 Gala  •  320 Tiyatro  •  450 Kokteyl  •  180 Sınıf  |  3×63A Trifaze Pano</text>
      <text x="24" y="90" font-family="Arial, sans-serif" font-size="9.5" fill="#9A7832">İdeal Kullanım: Ana Sergi, Bienal, Gala Yemeği, Marka Lansmanı &amp; Kokteyl</text>

      <!-- Vertical Core L3 -->
      <rect x="468" y="8" width="184" height="90" fill="#F4EFE6" stroke="#1A1817" stroke-width="1.2"/>
      <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1817">3. KAT FUAYE &amp; ERİŞİM</text>
      <text x="560" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Asansör (630 kg) + Tarihi Merdiven</text>
      <text x="560" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#9A7832">Catering Hazırlık &amp; Misafir WC</text>
    </g>

    <!-- LEVEL 2 ROW (275 m²) -->
    <g transform="translate(0, 148)">
      <rect x="0" y="0" width="660" height="106" fill="#FFFFFF" stroke="#1A1817" stroke-width="3.5"/>
      <rect x="8" y="8" width="452" height="90" fill="#FCFBF8" stroke="#C5A059" stroke-width="1.2"/>
      <text x="24" y="32" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#9A7832">KAT 2 • PARALEL OTURUM, ATÖLYE &amp; VIP KATI (TAVAN: 4.20 m)</text>
      <text x="24" y="54" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1A1817">5 Bağlantılı Tarihi Galeri Odası + Orta Hol — 275 m²</text>
      <text x="24" y="74" font-family="Arial, sans-serif" font-size="10" fill="#5C554E">Kapasite: 90 VIP Yemek  •  140 Seminer  •  250 Kokteyl  •  100 Sınıf  |  3×32A Trifaze Pano</text>
      <text x="24" y="90" font-family="Arial, sans-serif" font-size="9.5" fill="#9A7832">İdeal Kullanım: Breakout Odaları, VIP Lounge, Basın Odası, Kulis (Green Room) &amp; Butik Sergi</text>

      <!-- Vertical Core L2 -->
      <rect x="468" y="8" width="184" height="90" fill="#F4EFE6" stroke="#1A1817" stroke-width="1.2"/>
      <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1817">2. KAT FUAYE &amp; ERİŞİM</text>
      <text x="560" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Asansör (630 kg) + Tarihi Merdiven</text>
      <text x="560" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#9A7832">Coffee Break Alanı &amp; Misafir WC</text>
    </g>

    <!-- LEVEL 1 ROW (227 + 100 m²) -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="660" height="124" fill="#FFFFFF" stroke="#1A1817" stroke-width="3.5"/>
      <rect x="8" y="8" width="452" height="108" fill="#FCFBF8" stroke="#C5A059" stroke-width="1.5"/>
      <text x="24" y="32" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#9A7832">KAT 1 • ANITSAL BÜYÜK SALON, ASMA KAT &amp; GİRİŞ FUAYESİ (TAVAN: 6.20 m)</text>
      <text x="24" y="55" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1A1817">Kolonsuz Büyük Salon (227 m²) + Fuaye &amp; Asma Kat (100 m²)</text>
      <text x="24" y="76" font-family="Arial, sans-serif" font-size="10" fill="#5C554E">Kapasite: 160 Gala  •  250 Tiyatro/Konser  •  350 Kokteyl  •  120 Sınıf  |  3×63A AV Enerji</text>
      <text x="24" y="94" font-family="Arial, sans-serif" font-size="9.5" fill="#9A7832">İdeal Kullanım: Ana Konferans (Plenary), Gala Yemeği, Konser, Kayıt &amp; Karşılama</text>

      <!-- Vertical Core L1 -->
      <rect x="468" y="8" width="184" height="108" fill="#EFE9DC" stroke="#1A1817" stroke-width="1.5"/>
      <text x="560" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1A1817">ANA GİRİŞ &amp; KAYIT</text>
      <text x="560" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Kemeraltı Cd. No:49 Girişi</text>
      <text x="560" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Vestiyer • Catering • PRM WC</text>
      <text x="560" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#9A7832">Yükleme &amp; Asansör Başlangıcı</text>
    </g>
  </g>

  <!-- Bottom Summary Metrics Bar -->
  <g transform="translate(70, 526)" font-family="Arial, sans-serif" font-size="10.5" fill="#1A1817">
    <rect x="0" y="0" width="660" height="44" rx="4" fill="#F4EFE6" stroke="#C5A059" stroke-width="1.2"/>
    <text x="24" y="26" font-weight="700" fill="#9A7832">TÜM BİNA BUYOUT ÖZETİ:</text>
    <text x="180" y="26"><tspan font-weight="700">1.060 m²</tspan> Etkinlik Alanı</text>
    <text x="320" y="26">•  <tspan font-weight="700">450 Kişi</tspan> Gala</text>
    <text x="425" y="26">•  <tspan font-weight="700">650 Kişi</tspan> Zirve/Tiyatro</text>
    <text x="560" y="26">•  <tspan font-weight="700">850 Kişi</tspan> Kokteyl</text>
  </g>
</svg>
