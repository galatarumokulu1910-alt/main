<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <pattern id="archGrid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C5A059" stroke-width="0.4" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatchMezz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C5A059" stroke-width="1" stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#FAF7F2"/>
  <rect x="24" y="24" width="752" height="572" fill="url(#archGrid1)" stroke="#C5A059" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="30" y="30" width="740" height="560" fill="none" stroke="#1A1817" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top Header Banner -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1A1817">
    <text x="50" y="62" font-size="11" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5" fill="#9A7832">KAT 1 • MİMARİ YERLEŞİM &amp; TEKNİK PLANI</text>
    <text x="50" y="86" font-size="22" font-weight="600">Büyük Salon, Fuaye &amp; Asma Kat (227 + 100 m²)</text>
    <text x="50" y="105" font-size="11.5" font-family="Arial, sans-serif" fill="#5C554E">Tavan Yüksekliği: 6.20 m (Asma Kat Altı: 2.85 m)  |  Ana Salon: 19.0 m × 12.0 m (Kolonsuz)</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(715, 72)">
    <circle cx="0" cy="0" r="22" fill="#FAF7F2" stroke="#C5A059" stroke-width="1"/>
    <polygon points="0,-18 4,-4 0,-7 -4,-4" fill="#1A1817"/>
    <polygon points="0,18 4,4 0,7 -4,4" fill="#C5A059"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#C5A059" stroke-width="0.8"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1A1817">N</text>
  </g>

  <!-- Outer Neoclassical Building Footprint -->
  <g transform="translate(70, 135)">
    <!-- Outer Load-Bearing Masonry Wall -->
    <rect x="0" y="0" width="660" height="370" fill="#FFFFFF" stroke="#1A1817" stroke-width="5"/>

    <!-- Window Bays on North (Kemeraltı Cd.) Facade -->
    <g fill="#FAF7F2" stroke="#C5A059" stroke-width="2">
      <rect x="65" y="-4" width="46" height="8"/>
      <rect x="145" y="-4" width="46" height="8"/>
      <rect x="225" y="-4" width="46" height="8"/>
      <rect x="305" y="-4" width="46" height="8"/>
      <rect x="385" y="-4" width="46" height="8"/>
    </g>

    <!-- Window Bays on South Facade -->
    <g fill="#FAF7F2" stroke="#C5A059" stroke-width="2">
      <rect x="65" y="366" width="46" height="8"/>
      <rect x="165" y="366" width="46" height="8"/>
      <rect x="265" y="366" width="46" height="8"/>
      <rect x="365" y="366" width="46" height="8"/>
    </g>

    <!-- STAGE / AV ZONE (Left end of Grand Hall) -->
    <rect x="12" y="24" width="76" height="322" fill="#F4EFE6" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="50" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#9A7832" transform="rotate(-90 50 172)">SAHNE / PODYUM &amp; PROJEKSİYON ALANI</text>
    <text x="50" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E" transform="rotate(-90 50 190)">(3×63A Trifaze AV Enerji Noktası)</text>

    <!-- MAIN COLUMN-FREE GRAND HALL (227 m²) -->
    <rect x="88" y="12" width="372" height="346" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.4"/>

    <!-- MEZZANINE GALLERY OVERLOOK (U-Shaped Balcony above East & North/South edges: 60 + 22 m²) -->
    <path d="M 355 12 L 460 12 L 460 358 L 355 358 L 355 312 L 412 312 L 412 58 L 355 58 Z" fill="url(#hatchMezz)" stroke="#9A7832" stroke-width="1.2" stroke-dasharray="4,2"/>
    <rect x="364" y="142" width="88" height="86" rx="3" fill="#FAF7F2" fill-opacity="0.92" stroke="#C5A059" stroke-width="1"/>
    <text x="408" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1A1817">Asma Kat</text>
    <text x="408" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#9A7832">60 + 22 m²</text>
    <text x="408" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Balkon &amp; VIP İzleme</text>
    <text x="408" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">(Alt H: 2.85 m)</text>

    <!-- Center Label of Grand Hall -->
    <g text-anchor="middle">
      <text x="230" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#9A7832">ANA ETKİNLİK &amp; KONFERANS SALONU</text>
      <text x="230" y="172" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1A1817">Büyük Salon</text>
      <text x="230" y="196" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#9A7832">227 m² Net Alan</text>
      <text x="230" y="218" font-family="Arial, sans-serif" font-size="10.5" fill="#5C554E">Kolonsuz Açıklık: 19.0 m × 12.0 m  •  Tavan: 6.20 m</text>
      <text x="230" y="236" font-family="Arial, sans-serif" font-size="10" fill="#5C554E">Orijinal Desenli Karo Zemin • Akustik &amp; Ray Işık Sistemi</text>
    </g>

    <!-- Dimension Arrows Inside Grand Hall -->
    <g stroke="#9A7832" stroke-width="1">
      <line x1="96" y1="336" x2="452" y2="336"/>
      <polygon points="96,336 103,333 103,339" fill="#9A7832"/>
      <polygon points="452,336 445,333 445,339" fill="#9A7832"/>
      <rect x="238" y="327" width="72" height="16" fill="#FFFFFF"/>
      <text x="274" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9A7832" stroke="none">19.00 m</text>
    </g>

    <!-- Interior Partition Wall between Grand Hall (460) and East Foyer/Core (460..660) -->
    <line x1="460" y1="0" x2="460" y2="130" stroke="#1A1817" stroke-width="4"/>
    <!-- Double Monumental Doors between Foyer and Grand Hall -->
    <path d="M 460 130 A 32 32 0 0 0 428 162" fill="none" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="460" y1="130" x2="428" y2="130" stroke="#1A1817" stroke-width="2"/>
    <path d="M 460 220 A 32 32 0 0 1 428 188" fill="none" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="460" y1="220" x2="428" y2="220" stroke="#1A1817" stroke-width="2"/>
    <line x1="460" y1="220" x2="460" y2="370" stroke="#1A1817" stroke-width="4"/>

    <!-- RIGHT WING: FOYER, REGISTRATION, GRAND STAIRCASE, ELEVATOR, CATERING & WC (100 m²) -->
    <!-- Top-Right: Monumental Staircase -->
    <rect x="462" y="4" width="126" height="92" fill="#F6F2EA" stroke="#1A1817" stroke-width="1.5"/>
    <g stroke="#5C554E" stroke-width="0.9">
      <line x1="474" y1="14" x2="474" y2="84"/>
      <line x1="484" y1="14" x2="484" y2="84"/>
      <line x1="494" y1="14" x2="494" y2="84"/>
      <line x1="504" y1="14" x2="504" y2="84"/>
      <line x1="514" y1="14" x2="514" y2="84"/>
      <line x1="524" y1="14" x2="524" y2="84"/>
      <line x1="534" y1="14" x2="534" y2="84"/>
    </g>
    <text x="558" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1A1817">TARİHİ</text>
    <text x="558" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1A1817">MERDİVEN</text>
    <text x="558" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#5C554E">(G: 2.10 m)</text>

    <!-- Elevator Box -->
    <rect x="588" y="4" width="68" height="92" fill="#EFE9DC" stroke="#1A1817" stroke-width="1.5"/>
    <line x1="588" y1="4" x2="656" y2="96" stroke="#C5A059" stroke-width="0.8"/>
    <line x1="656" y1="4" x2="588" y2="96" stroke="#C5A059" stroke-width="0.8"/>
    <rect x="596" y="28" width="52" height="44" fill="#FAF7F2" stroke="#9A7832" stroke-width="1"/>
    <text x="622" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1A1817">ASANSÖR</text>
    <text x="622" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9A7832">630 kg / 8 Kişi</text>

    <!-- Central Entrance Foyer & Registration -->
    <rect x="462" y="96" width="194" height="168" fill="#FCFBF8" stroke="#C5A059" stroke-width="1"/>
    <text x="558" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A1817">Giriş Fuayesi &amp; Kayıt</text>
    <text x="558" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9A7832">100 m² (Fuaye + Sirkülasyon)</text>
    <text x="558" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Karşılama Bankosu • Kokteyl Bar</text>
    <text x="558" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Vestiyer &amp; Akreditasyon Alanı</text>

    <!-- Bottom-Right: Catering Prep & Restrooms -->
    <rect x="462" y="264" width="98" height="102" fill="#F6F2EA" stroke="#1A1817" stroke-width="1.5"/>
    <text x="511" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1817">CATERING</text>
    <text x="511" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5C554E">Servis &amp; Hazırlık</text>
    <text x="511" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9A7832">(Back-of-House)</text>

    <rect x="560" y="264" width="96" height="102" fill="#F6F2EA" stroke="#1A1817" stroke-width="1.5"/>
    <text x="608" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1A1817">VESTİYER &amp; WC</text>
    <text x="608" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#5C554E">Misafir &amp; PRM WC</text>

    <!-- Main Entrance Marker on East Wall (Kemeraltı Cd.) -->
    <rect x="654" y="150" width="10" height="60" fill="#C5A059"/>
    <text x="646" y="184" text-anchor="end" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#9A7832">ANA GİRİŞ / YÜKLEME ←</text>
  </g>

  <!-- Bottom Legend & Scale Bar -->
  <g transform="translate(50, 536)" font-family="Arial, sans-serif" font-size="10" fill="#1A1817">
    <rect x="0" y="0" width="14" height="14" fill="#F4EFE6" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="20" y="11">Sahne / AV Alanı</text>

    <rect x="130" y="0" width="14" height="14" fill="url(#hatchMezz)" stroke="#9A7832" stroke-width="1"/>
    <text x="150" y="11">Asma Kat (60+22 m²)</text>

    <rect x="285" y="0" width="14" height="14" fill="#EFE9DC" stroke="#1A1817" stroke-width="1"/>
    <text x="305" y="11">Asansör &amp; Dikey Erişim</text>

    <rect x="445" y="0" width="14" height="14" fill="#F6F2EA" stroke="#1A1817" stroke-width="1"/>
    <text x="465" y="11">Catering &amp; Operasyon</text>

    <!-- Scale Bar -->
    <g transform="translate(600, 2)">
      <line x1="0" y1="8" x2="120" y2="8" stroke="#1A1817" stroke-width="1.5"/>
      <line x1="0" y1="3" x2="0" y2="13" stroke="#1A1817" stroke-width="1.5"/>
      <line x1="60" y1="4" x2="60" y2="12" stroke="#1A1817" stroke-width="1.2"/>
      <line x1="120" y1="3" x2="120" y2="13" stroke="#1A1817" stroke-width="1.5"/>
      <text x="0" y="-1" font-size="8.5" fill="#5C554E">0</text>
      <text x="56" y="-1" font-size="8.5" fill="#5C554E">5m</text>
      <text x="110" y="-1" font-size="8.5" fill="#5C554E">10m</text>
    </g>
  </g>
</svg>
